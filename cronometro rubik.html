<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik Timer Pro</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="https://cdn.cubing.net/js/cubing/twisty"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-orange: #f97316;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --bg-pattern: none;
        }

        /* 20 Estilos de Temas */
        [data-theme="dark"] { --bg-color: #090d16; --panel-bg: rgba(18, 24, 38, 0.65); --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #3b82f6; --border-color: rgba(255, 255, 255, 0.1); }
        [data-theme="light"] { --bg-color: #f1f5f9; --panel-bg: rgba(255, 255, 255, 0.85); --text-main: #0f172a; --text-muted: #64748b; --accent: #2563eb; --border-color: rgba(0, 0, 0, 0.08); }
        [data-theme="neon"] { --bg-color: #030308; --panel-bg: rgba(10, 10, 20, 0.85); --text-main: #00ffff; --text-muted: #ff00ff; --accent: #00ffff; --border-color: rgba(0, 255, 255, 0.3); --bg-pattern: linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px); --bg-pattern-size: 30px 30px; }
        [data-theme="carbon"] { --bg-color: #0c0a09; --panel-bg: rgba(28, 25, 23, 0.85); --text-main: #fdba74; --text-muted: #a8a29e; --accent: #ea580c; --border-color: rgba(234, 88, 12, 0.3); --bg-pattern: radial-gradient(rgba(234, 88, 12, 0.12) 1px, transparent 1px); --bg-pattern-size: 20px 20px; }
        [data-theme="royal"] { --bg-color: #09090b; --panel-bg: rgba(20, 20, 24, 0.9); --text-main: #facc15; --text-muted: #a1a1aa; --accent: #eab308; --border-color: rgba(234, 179, 8, 0.4); --bg-pattern: linear-gradient(135deg, rgba(234, 179, 8, 0.04) 25%, transparent 25%), linear-gradient(225deg, rgba(234, 179, 8, 0.04) 25%, transparent 25%); --bg-pattern-size: 40px 40px; }
        [data-theme="sakura"] { --bg-color: #fdf2f8; --panel-bg: rgba(255, 255, 255, 0.75); --text-main: #831843; --text-muted: #be185d; --accent: #db2777; --border-color: rgba(219, 39, 119, 0.3); --bg-pattern: radial-gradient(rgba(219,39,119, 0.05) 2px, transparent 2px); --bg-pattern-size: 20px 20px;}
        [data-theme="ocean"] { --bg-color: #082f49; --panel-bg: rgba(12, 74, 110, 0.8); --text-main: #e0f2fe; --text-muted: #7dd3fc; --accent: #0ea5e9; --border-color: rgba(14, 165, 233, 0.4); --bg-pattern: linear-gradient(0deg, rgba(14,165,233,0.05) 1px, transparent 1px); --bg-pattern-size: 100% 10px; }
        [data-theme="dracula"] { --bg-color: #282a36; --panel-bg: rgba(68, 71, 90, 0.8); --text-main: #f8f8f2; --text-muted: #bd93f9; --accent: #ff79c6; --border-color: rgba(255, 121, 198, 0.4); }
        [data-theme="matrix"] { --bg-color: #000000; --panel-bg: rgba(0, 20, 0, 0.8); --text-main: #00ff00; --text-muted: #008800; --accent: #00ff00; --border-color: rgba(0, 255, 0, 0.4); --bg-pattern: linear-gradient(rgba(0, 255, 0, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 0, 0.05) 1px, transparent 1px); --bg-pattern-size: 20px 20px; }
        [data-theme="sunset"] { --bg-color: #2e0249; --panel-bg: rgba(87, 10, 87, 0.7); --text-main: #f8fafc; --text-muted: #fca5a5; --accent: #f97316; --border-color: rgba(249, 115, 22, 0.4); --bg-pattern: linear-gradient(135deg, rgba(249,115,22,0.1) 0%, transparent 100%); }
        [data-theme="cyberpunk"] { --bg-color: #120458; --panel-bg: rgba(30, 10, 80, 0.85); --text-main: #ffe600; --text-muted: #ff0055; --accent: #00f0ff; --border-color: rgba(255, 0, 85, 0.4); }
        [data-theme="sunset-neon"] { --bg-color: #1a0b2e; --panel-bg: rgba(45, 15, 65, 0.8); --text-main: #ff77ff; --text-muted: #ffaa33; --accent: #ff3366; --border-color: rgba(255, 51, 102, 0.4); }
        [data-theme="midnight-purple"] { --bg-color: #110c1d; --panel-bg: rgba(26, 18, 43, 0.85); --text-main: #d8b4fe; --text-muted: #9333ea; --accent: #a855f7; --border-color: rgba(168, 85, 247, 0.3); }
        [data-theme="emerald"] { --bg-color: #022c22; --panel-bg: rgba(6, 78, 59, 0.8); --text-main: #a7f3d0; --text-muted: #34d399; --accent: #10b981; --border-color: rgba(16, 185, 129, 0.4); }
        [data-theme="coffee"] { --bg-color: #1c1410; --panel-bg: rgba(44, 33, 26, 0.85); --text-main: #fde047; --text-muted: #d4d4d8; --accent: #d97706; --border-color: rgba(217, 119, 6, 0.4); }
        [data-theme="arctic"] { --bg-color: #e2e8f0; --panel-bg: rgba(255, 255, 255, 0.9); --text-main: #1e293b; --text-muted: #475569; --accent: #0284c7; --border-color: rgba(2, 132, 199, 0.3); }
        [data-theme="lava"] { --bg-color: #1a0505; --panel-bg: rgba(45, 12, 12, 0.85); --text-main: #fca5a5; --text-muted: #f87171; --accent: #dc2626; --border-color: rgba(220, 38, 38, 0.4); }
        [data-theme="neon-mint"] { --bg-color: #02231e; --panel-bg: rgba(4, 47, 40, 0.8); --text-main: #5ffee7; --text-muted: #2dd4bf; --accent: #14b8a6; --border-color: rgba(20, 184, 166, 0.4); }
        [data-theme="amethyst"] { --bg-color: #180d2b; --panel-bg: rgba(42, 22, 69, 0.8); --text-main: #f3e8ff; --text-muted: #d8b4fe; --accent: #c084fc; --border-color: rgba(192, 132, 252, 0.4); }
        [data-theme="steampunk"] { --bg-color: #211911; --panel-bg: rgba(48, 38, 28, 0.85); --text-main: #fef08a; --text-muted: #b45309; --accent: #d97706; --border-color: rgba(217, 119, 6, 0.4); }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); background-image: var(--bg-pattern); background-size: var(--bg-pattern-size, auto); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; padding: 12px; transition: background-color 0.4s, color 0.4s; }
        .app-container { display: flex; flex-direction: column; height: 100%; max-width: 1400px; margin: 0 auto; width: 100%; gap: 12px; }

        /* Top Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 8px 16px; border-radius: 12px; border: 1px solid var(--border-color); flex-shrink: 0; flex-wrap: wrap; gap: 10px;}
        .top-bar-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;}
        
        /* Logo con Favicon */
        .logo-container { display: flex; align-items: center; gap: 8px; margin-right: 10px; }
        .logo-img { width: 26px; height: 26px; border-radius: 6px; object-fit: cover; }
        .logo-text { font-weight: 800; font-size: 1.1rem; letter-spacing: -0.5px; color: var(--accent); }

        select, .btn { background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.2s ease; outline: none; }
        .btn:hover, select:hover { border-color: var(--accent); }
        .btn-action { background: var(--accent); color: var(--bg-color); border: none; font-weight: 700; }
        .wca-toggle { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 0.85rem; font-weight: 700; background: var(--bg-color); padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border-color); transition: 0.3s; color: var(--text-muted);}
        .wca-toggle.active { border-color: var(--accent-orange); color: var(--accent-orange); box-shadow: 0 0 10px rgba(249, 115, 22, 0.2); }

        /* Scramble */
        .scramble-section { display: flex; gap: 15px; align-items: center; background: var(--panel-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 20px; box-shadow: var(--shadow); flex-shrink: 0; min-height: 70px; }
        .scramble-text-area { flex: 1; text-align: center; }
        .scramble-title { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 4px; font-weight: 700;}
        #scramble-text { font-size: 1.15rem; font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: 1px; color: var(--text-main); line-height: 1.3;}
        .visualizer-container { width: 120px; height: 90px; flex-shrink: 0; background: var(--bg-color); border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color); }
        twisty-player { width: 100%; height: 100%; }

        /* Main Section */
        .main-section { display: grid; grid-template-columns: 2.2fr 1fr; gap: 12px; flex: 1; min-height: 0; }
        .left-column { display: flex; flex-direction: column; gap: 12px; height: 100%; min-height: 0; }

        /* Timer */
        .timer-area { flex: 1.8; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: var(--panel-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 12px; cursor: pointer; user-select: none; box-shadow: var(--shadow); position: relative; min-height: 160px; transition: border-color 0.2s, box-shadow 0.2s; }
        #timer { font-size: clamp(4rem, 9vw, 8.5rem); font-family: 'JetBrains Mono', monospace; font-weight: 800; transition: color 0.1s ease, text-shadow 0.1s ease; line-height: 1; letter-spacing: -2px; }
        
        .timer-ready { color: var(--accent-green) !important; text-shadow: 0 0 25px rgba(34, 197, 94, 0.6); }
        .timer-inspecting { color: var(--accent-orange) !important; text-shadow: 0 0 25px rgba(249, 115, 22, 0.6); }
        .timer-penalty { color: var(--accent-red) !important; text-shadow: 0 0 25px rgba(239, 68, 68, 0.6); }

        .instructions { color: var(--text-muted); font-size: 0.85rem; margin-top: 15px; text-align: center; }
        .manual-btn { position: absolute; bottom: 12px; right: 12px; background: var(--bg-color); color: var(--text-muted); padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; border: 1px solid var(--border-color); cursor: pointer; transition: all 0.2s; }
        .manual-btn:hover { color: var(--text-main); border-color: var(--accent); }

        /* Estadísticas Extendidas */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; flex-shrink: 0; }
        .stat-card { background: var(--panel-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); padding: 8px; border-radius: 10px; text-align: center; box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: center; }
        .stat-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 2px; letter-spacing: 0.5px;}
        .stat-value { font-size: 1rem; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
        
        /* Gráfica */
        .chart-container { flex: 1.2; background: var(--panel-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px; box-shadow: var(--shadow); min-height: 120px; display: flex; align-items: center; }

        /* Historial y Acciones */
        .right-column { display: flex; flex-direction: column; height: 100%; min-height: 0; }
        .history-panel { background: var(--panel-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 12px; display: flex; flex-direction: column; height: 100%; box-shadow: var(--shadow); overflow: hidden; }
        .history-header { padding: 12px 16px; background: rgba(0,0,0,0.1); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .history-header h3 { font-size: 0.95rem; margin: 0; font-weight: 700;}
        #times-list { list-style: none; overflow-y: auto; flex: 1; padding: 0; margin: 0; }
        #times-list li { padding: 10px 12px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; transition: background 0.15s;}
        #times-list li:hover { background: rgba(255,255,255,0.03); }
        .time-left { display: flex; align-items: center; gap: 10px; width: 100%; margin-bottom: 5px; }
        .time-actions { display: flex; gap: 5px; width: 100%; justify-content: flex-end; }
        .time-index { color: var(--text-muted); font-size: 0.85em; width: 30px; font-weight: 700;}
        .time-value { font-family: 'JetBrains Mono', monospace; font-size: 1.1em; font-weight: 700; flex-grow: 1; }
        .time-penalty { color: var(--accent-red); font-size: 0.8em; margin-left: 5px; vertical-align: top;}
        
        .action-btn { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 4px; padding: 2px 6px; font-size: 0.75rem; cursor: pointer; transition: 0.2s; font-weight: bold;}
        .action-btn:hover { color: var(--text-main); border-color: var(--accent); }
        .action-btn.active-pen { background: var(--accent-red); color: white; border-color: var(--accent-red); }
        .action-btn.active-p2 { background: var(--accent-orange); color: white; border-color: var(--accent-orange); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        @media (max-width: 950px) { body { height: auto; overflow-y: auto; } .main-section { grid-template-columns: 1fr; display: flex; flex-direction: column;} .scramble-section { flex-direction: column; } .right-column { height: 400px; flex: none; } .time-left, .time-actions { width: auto; margin:0; } #times-list li { flex-wrap: nowrap; gap: 10px;} }
    </style>
</head>
<body data-theme="dark">

    <div class="app-container">
        
        <div class="top-bar">
            <div class="top-bar-group">
                <div class="logo-container">
                    <img src="favicon.png" alt="Logo" class="logo-img">
                    <div class="logo-text">RUBIK TIMER PRO</div>
                </div>
                <select id="theme-selector" onchange="changeTheme()">
                    <option value="dark">🌙 Dark Glass (Por defecto)</option>
                    <option value="light">☀️ Light Clean</option>
                    <option value="neon">🟣 Cyber Neon</option>
                    <option value="carbon">🟠 Carbon Pro</option>
                    <option value="royal">🟡 Royal Gold</option>
                    <option value="sakura">🌸 Sakura Blossom</option>
                    <option value="ocean">🌊 Deep Ocean</option>
                    <option value="dracula">🧛 Dracula</option>
                    <option value="matrix">💻 Matrix</option>
                    <option value="sunset">🌅 Sunset Vibes</option>
                    <option value="cyberpunk">⚡ Cyberpunk</option>
                    <option value="sunset-neon">🌇 Sunset Neon</option>
                    <option value="midnight-purple">🌌 Midnight Purple</option>
                    <option value="emerald">🌲 Emerald Dark</option>
                    <option value="coffee">☕ Coffee Warm</option>
                    <option value="arctic">❄️ Arctic Clean</option>
                    <option value="lava">🔥 Lava Fire</option>
                    <option value="neon-mint">🌿 Neon Mint</option>
                    <option value="amethyst">🔮 Amethyst Dream</option>
                    <option value="steampunk">⚙️ Steampunk Brass</option>
                </select>
                <select id="puzzle-selector" onchange="handlePuzzleChange()">
                    <optgroup label="Estándar WCA">
                        <option value="2x2x2">2x2x2</option>
                        <option value="3x3x3" selected>3x3x3</option>
                        <option value="4x4x4">4x4x4</option>
                        <option value="5x5x5">5x5x5</option>
                        <option value="Pyraminx">Pyraminx</option>
                        <option value="Megaminx">Megaminx</option>
                        <option value="Skewb">Skewb</option>
                        <option value="Square-1">Square-1</option>
                    </optgroup>
                    <optgroup label="Entrenamiento">
                        <option value="OLL">Trainer OLL (3x3)</option>
                        <option value="PLL">Trainer PLL (3x3)</option>
                    </optgroup>
                    <optgroup label="Personalizados" id="custom-puzzles-group"></optgroup>
                    <optgroup label="Acciones">
                        <option value="ADD_NEW" style="font-weight: bold; color: var(--accent);">➕ Añadir nuevo cubo...</option>
                        <option value="DEL_CUSTOM" style="font-weight: bold; color: var(--accent-red);">🗑️ Borrar cubo personalizado actual</option>
                    </optgroup>
                </select>
                <select id="session-selector" onchange="handleSessionChange()">
                    <option value="Sesion 1">Sesión 1</option>
                    <option value="ADD_SESSION" style="font-weight: bold; color: var(--accent-green);">➕ Nueva sesión...</option>
                    <option value="DEL_SESSION" style="font-weight: bold; color: var(--accent-red);">🗑️ Borrar esta sesión</option>
                </select>
            </div>
            <div class="top-bar-group">
                <button id="wca-toggle-btn" class="wca-toggle" onclick="toggleWCA()">Inspección 15s: OFF</button>
                <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importData(event)">
                <button class="btn" onclick="document.getElementById('import-file').click()">📥 Importar</button>
                <button class="btn btn-action" onclick="exportData()">📤 Backup</button>
            </div>
        </div>

        <div class="scramble-section" id="scramble-wrapper">
            <div class="scramble-text-area">
                <div class="scramble-title">Mezcla actual (<span id="current-puzzle-label">3x3x3</span> - <span id="current-session-label">Sesión 1</span>)</div>
                <div id="scramble-text">Cargando mezcla...</div>
            </div>
            <div class="visualizer-container" id="visualizer-box">
                <twisty-player id="visualizer" puzzle="3x3x3" visualization="2D" control-panel="none" background="none"></twisty-player>
            </div>
        </div>

        <div class="main-section">
            <div class="left-column">
                
                <div class="timer-area" id="timer-area">
                    <div id="timer">00:00.00</div>
                    <div class="instructions" id="timer-instructions">Mantén Espacio o Pantalla para preparar. Suelta para iniciar.</div>
                    <button class="manual-btn" onclick="addManualTime(event)">✍️ Tiempo Manual</button>
                </div>

                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-label">Récord</div><div class="stat-value" style="color: var(--accent-green)" id="stat-best">--</div></div>
                    <div class="stat-card"><div class="stat-label">Peor</div><div class="stat-value" style="color: var(--accent-red)" id="stat-worst">--</div></div>
                    <div class="stat-card"><div class="stat-label">Media Total</div><div class="stat-value" id="stat-total">--</div></div>
                    <div class="stat-card"><div class="stat-label">Mejor Ao5</div><div class="stat-value" id="stat-best-ao5">--</div></div>
                    <div class="stat-card"><div class="stat-label">Ao5 Actual</div><div class="stat-value" id="stat-ao5">--</div></div>
                    <div class="stat-card"><div class="stat-label">Ao12 Actual</div><div class="stat-value" id="stat-ao12">--</div></div>
                    <div class="stat-card"><div class="stat-label">Desviación (σ)</div><div class="stat-value" id="stat-dev">--</div></div>
                </div>

                <div class="chart-container">
                    <canvas id="progressionChart"></canvas>
                </div>

            </div>

            <div class="right-column">
                <div class="history-panel">
                    <div class="history-header">
                        <h3>Tiempos Guardados</h3>
                        <button class="btn" style="color:var(--accent-red); border-color:var(--accent-red); padding: 4px 8px;" onclick="clearSessionTimes()">Borrar Tiempos</button>
                    </div>
                    <ul id="times-list"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        let startTime, timerInterval, inspectionInterval;
        let timerState = 'IDLE'; 
        let times = []; 
        let currentPuzzle = '3x3x3'; 
        let currentSession = 'Sesion 1';
        let currentScrambleStr = ''; 
        let chartInstance = null;
        let customPuzzles = [];
        let sessionsList = {}; 
        
        let wcaMode = false;
        let inspectionTimeRemaining = 15;
        let currentPenalty = null;

        const timerDisplay = document.getElementById('timer');
        const timerInstructions = document.getElementById('timer-instructions');
        const timerArea = document.getElementById('timer-area');
        const scrambleText = document.getElementById('scramble-text');
        const puzzleSelector = document.getElementById('puzzle-selector');
        const sessionSelector = document.getElementById('session-selector');
        const visualizer = document.getElementById('visualizer');
        const visualizerBox = document.getElementById('visualizer-box');
        const wcaBtn = document.getElementById('wca-toggle-btn');
        const customGroup = document.getElementById('custom-puzzles-group');

        const pllScrambles = ["R U R' U' R' F R2 U' R' U' R U R' F'", "R U R' F' R U R' U' R' F R2 U' R' U'", "R2 U R U R' U' R' U' R' U R'", "R U' R U R U R U' R' U' R2"];
        const ollScrambles = ["R U2 R' U' R U' R'", "R U R' U R U2 R'", "F R U R' U' F'", "f R U R' U' f'", "R U R' U' R' F R F'"];

        function changeTheme() {
            const theme = document.getElementById('theme-selector').value;
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('rubik_timer_pro_theme', theme);
            document.getElementById('theme-selector').blur();
            updateChart(); 
        }

        function toggleWCA() {
            wcaMode = !wcaMode;
            wcaBtn.classList.toggle('active', wcaMode);
            wcaBtn.innerText = wcaMode ? "Inspección 15s: ON" : "Inspección 15s: OFF";
            timerInstructions.innerText = wcaMode ? "Pulsa espacio para iniciar inspección de 15s" : "Mantén Espacio o Pantalla para preparar.";
            wcaBtn.blur();
        }

        function playBeep(freq, duration) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.frequency.value = freq;
                osc.connect(ctx.destination);
                osc.start();
                setTimeout(() => { osc.stop(); ctx.close(); }, duration);
            } catch(e) {}
        }

        function loadSessionsList() {
            const saved = localStorage.getItem('rubik_timer_pro_sessions_map');
            sessionsList = saved ? JSON.parse(saved) : {};
            if (!sessionsList[currentPuzzle]) sessionsList[currentPuzzle] = ['Sesion 1'];
            
            sessionSelector.innerHTML = '';
            sessionsList[currentPuzzle].forEach(s => {
                let opt = document.createElement('option');
                opt.value = s; opt.innerText = s;
                if(s === currentSession) opt.selected = true;
                sessionSelector.appendChild(opt);
            });
            let addOpt = document.createElement('option'); addOpt.value = 'ADD_SESSION'; addOpt.innerText = '➕ Nueva sesión...'; addOpt.style.fontWeight = 'bold'; addOpt.style.color = 'var(--accent-green)'; sessionSelector.appendChild(addOpt);
            let delOpt = document.createElement('option'); delOpt.value = 'DEL_SESSION'; delOpt.innerText = '🗑️ Borrar esta sesión'; delOpt.style.fontWeight = 'bold'; delOpt.style.color = 'var(--accent-red)'; sessionSelector.appendChild(delOpt);
        }

        function saveSessionsList() { localStorage.setItem('rubik_timer_pro_sessions_map', JSON.stringify(sessionsList)); }

        function handleSessionChange() {
            const val = sessionSelector.value;
            if (val === 'ADD_SESSION') {
                let name = prompt("Nombre para la nueva sesión:");
                if (name && name.trim() !== "") {
                    name = name.trim();
                    if (!sessionsList[currentPuzzle].includes(name)) { sessionsList[currentPuzzle].push(name); saveSessionsList(); }
                    currentSession = name;
                }
            } else if (val === 'DEL_SESSION') {
                if (sessionsList[currentPuzzle].length > 1) {
                    if (confirm(`¿Seguro que quieres eliminar completamente la "${currentSession}"?`)) {
                        localStorage.removeItem(getStorageKey());
                        sessionsList[currentPuzzle] = sessionsList[currentPuzzle].filter(s => s !== currentSession);
                        currentSession = sessionsList[currentPuzzle][0];
                        saveSessionsList();
                    }
                } else { alert("No puedes borrar la única sesión existente."); }
            } else { currentSession = val; }
            
            sessionSelector.blur();
            document.getElementById('current-session-label').innerText = currentSession;
            loadSessionsList(); loadTimes();
        }

        function loadCustomPuzzles() {
            const saved = localStorage.getItem('rubik_timer_pro_custom_list');
            customPuzzles = saved ? JSON.parse(saved) : [];
            customGroup.innerHTML = '';
            customPuzzles.forEach(p => {
                let opt = document.createElement('option'); opt.value = 'custom_' + p; opt.innerText = p; customGroup.appendChild(opt);
            });
        }

        function handlePuzzleChange() {
            const val = puzzleSelector.value;
            
            if (val === 'ADD_NEW') {
                let name = prompt("Nombre de tu nuevo cubo/categoría:");
                if (name && name.trim() !== "") {
                    if (!customPuzzles.includes(name.trim())) { customPuzzles.push(name.trim()); localStorage.setItem('rubik_timer_pro_custom_list', JSON.stringify(customPuzzles)); }
                    loadCustomPuzzles(); puzzleSelector.value = 'custom_' + name.trim();
                } else { puzzleSelector.value = currentPuzzle; return; }
            } 
            else if (val === 'DEL_CUSTOM') {
                if (currentPuzzle.startsWith('custom_')) {
                    let displayName = currentPuzzle.replace('custom_', '');
                    if (confirm(`¿Seguro que quieres eliminar el cubo personalizado "${displayName}" de la lista?`)) {
                        customPuzzles = customPuzzles.filter(p => p !== displayName);
                        localStorage.setItem('rubik_timer_pro_custom_list', JSON.stringify(customPuzzles));
                        loadCustomPuzzles();
                        puzzleSelector.value = '3x3x3';
                        alert(`Cubo "${displayName}" borrado.`);
                    } else {
                        puzzleSelector.value = currentPuzzle; return;
                    }
                } else {
                    alert("Solo puedes borrar cubos creados por ti (Personalizados).");
                    puzzleSelector.value = currentPuzzle; return;
                }
            }

            currentPuzzle = puzzleSelector.value; puzzleSelector.blur();
            
            if (!sessionsList[currentPuzzle]) { sessionsList[currentPuzzle] = ['Sesion 1']; saveSessionsList(); }
            currentSession = sessionsList[currentPuzzle][0]; 
            loadSessionsList();
            document.getElementById('current-session-label').innerText = currentSession;

            let displayName = currentPuzzle.startsWith('custom_') ? currentPuzzle.replace('custom_', '') : currentPuzzle;
            document.getElementById('current-puzzle-label').innerText = displayName;
            
            if (currentPuzzle.startsWith('custom_') || currentPuzzle === 'Square-1') {
                generateScramble(); visualizerBox.style.display = 'none';
            } else if (['Pyraminx', 'Megaminx', 'Skewb'].includes(currentPuzzle)) {
                visualizerBox.style.display = 'flex'; visualizer.setAttribute('puzzle', currentPuzzle.toLowerCase()); generateScramble();
            } else if (['OLL', 'PLL'].includes(currentPuzzle)) {
                visualizerBox.style.display = 'flex'; visualizer.setAttribute('puzzle', '3x3x3'); generateScramble();
            } else {
                visualizerBox.style.display = 'flex'; visualizer.setAttribute('puzzle', currentPuzzle.toLowerCase()); generateScramble();
            }
            loadTimes(); 
        }

        function getStorageKey() { return `rubik_timer_pro_times_${currentPuzzle.replace(/\s+/g, '_')}_${currentSession.replace(/\s+/g, '_')}`; }
        function saveTimes() { localStorage.setItem(getStorageKey(), JSON.stringify(times)); }
        
        function loadTimes() {
            const saved = localStorage.getItem(getStorageKey());
            let rawTimes = saved ? JSON.parse(saved) : [];
            times = rawTimes.map(t => typeof t === 'number' ? { time: t, penalty: null, scramble: "N/A" } : { time: t.time, penalty: t.penalty, scramble: t.scramble || "N/A" });
            updateStats();
        }

        function exportData() {
            let backup = {};
            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                if (key.startsWith('rubik_timer_pro')) backup[key] = localStorage.getItem(key);
            }
            const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `RubikTimer_Backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    for (const key in data) localStorage.setItem(key, data[key]);
                    alert("Backup importado con éxito."); location.reload(); 
                } catch(err) { alert("Error al leer JSON."); }
            };
            reader.readAsText(file);
        }

        function addManualTime(e) {
            e.stopPropagation(); 
            const input = prompt("Introduce tu tiempo en segundos (Ej: 14.25 o escribe DNF):");
            if(input) {
                if (input.toUpperCase().trim() === 'DNF') { times.push({ time: 0, penalty: 'DNF', scramble: currentScrambleStr });
                } else if (!isNaN(input.replace(',', '.'))) {
                    const ms = parseFloat(input.replace(',', '.')) * 1000;
                    times.push({ time: ms, penalty: null, scramble: currentScrambleStr });
                } else return;
                saveTimes(); updateStats(); generateScramble();
            }
        }

        window.setPenalty = function(index, penaltyType) {
            if (times[index].penalty === penaltyType) times[index].penalty = null; 
            else times[index].penalty = penaltyType; 
            saveTimes(); updateStats();
        };

        window.showScrambleInfo = function(index) {
            alert(`Mezcla para el tiempo #${times.length - index}:\n\n${times[index].scramble}`);
        };

        function generateScramble() {
            if (currentPuzzle.startsWith('custom_')) { currentScrambleStr = "Sin mezcla"; scrambleText.innerHTML = currentScrambleStr; return; }
            
            let scr = "";
            if (currentPuzzle.includes('x')) scr = generateNxNScramble(parseInt(currentPuzzle.split('x')[0]));
            else if (currentPuzzle === 'Pyraminx') scr = generatePyraminxScramble();
            else if (currentPuzzle === 'Megaminx') scr = generateMegaminxScramble();
            else if (currentPuzzle === 'Skewb') scr = generateSkewbScramble();
            else if (currentPuzzle === 'Square-1') scr = generateSquare1Scramble();
            else if (currentPuzzle === 'OLL') scr = ollScrambles[Math.floor(Math.random() * ollScrambles.length)];
            else if (currentPuzzle === 'PLL') scr = pllScrambles[Math.floor(Math.random() * pllScrambles.length)];
            
            currentScrambleStr = scr;
            scrambleText.innerHTML = scr; 
            if (currentPuzzle !== 'Square-1') visualizer.setAttribute('alg', scr.replace(/<br>/g, ' '));
        }

        function generateNxNScramble(size) {
            const faces = ['U', 'D', 'R', 'L', 'F', 'B'], mods = ['', "'", '2'];
            let len = size === 2 ? 11 : (size === 3 ? 21 : (size - 2) * 20), res = [], l = -1, sl = -1;
            for(let i=0; i<len; i++) {
                let f; do { f = Math.floor(Math.random() * 6); } while (f === l || (Math.floor(f/2) === Math.floor(l/2) && f === sl));
                let m = faces[f];
                if (size > 3) { let maxD = Math.floor(size/2), d = Math.floor(Math.random()*maxD)+1; if(d===2) m+='w'; else if(d>2) m=d+m+'w'; }
                res.push(m + mods[Math.floor(Math.random() * mods.length)]); sl = l; l = f;
            } return res.join(' ');
        }
        function generatePyraminxScramble() {
            const f = ['U', 'L', 'R', 'B'], t = ['u', 'l', 'r', 'b'], m = ['', "'"]; let res = [], l = -1;
            for(let i=0; i<11; i++) { let face; do{face=Math.floor(Math.random()*4);}while(face===l); res.push(f[face]+m[Math.floor(Math.random()*2)]); l=face; }
            t.forEach(tip => { if(Math.random()>0.5) res.push(tip+m[Math.floor(Math.random()*2)]); }); return res.join(' ');
        }
        function generateMegaminxScramble() {
            let res = [];
            for (let i = 0; i < 7; i++) { 
                let line = [];
                for (let j = 0; j < 5; j++) { line.push('R' + (Math.random() < 0.5 ? '++' : '--')); line.push('D' + (Math.random() < 0.5 ? '++' : '--')); }
                line.push('U' + (Math.random() < 0.5 ? "'" : "")); res.push(line.join(' '));
            } return res.join('<br>'); 
        }
        function generateSkewbScramble() {
            const f = ['R', 'L', 'U', 'B']; let res = [], l = -1;
            for(let i=0; i<11; i++) { let face; do{face=Math.floor(Math.random()*4);}while(face===l); res.push(f[face]+(Math.random()>0.5?"'":"")); l=face; }
            return res.join(' ');
        }
        function generateSquare1Scramble() {
            let res = [];
            for(let i=0; i<15; i++) { let t=0, b=0; do {t=Math.floor(Math.random()*12)-5; b=Math.floor(Math.random()*12)-5;} while(t===0&&b===0); res.push(`(${t},${b})`); }
            return res.join(' / ');
        }

        function getActualMs(tObj) {
            if (!tObj) return Infinity;
            if (tObj.penalty === 'DNF') return Infinity;
            return tObj.time + (tObj.penalty === '+2' ? 2000 : 0);
        }

        function formatTimeDisplay(msVal) {
            if (msVal === Infinity || msVal === null || isNaN(msVal)) return "--";
            let d = new Date(msVal), m = d.getUTCMinutes().toString().padStart(2, '0');
            let s = d.getUTCSeconds().toString().padStart(2, '0'), msF = Math.floor(d.getUTCMilliseconds()/10).toString().padStart(2, '0');
            return `${m === '00' ? '' : m + ':'}${s}.${msF}`;
        }

        function calcWCA(arr) {
            if (arr.length < 3) return null;
            let vals = arr.map(t => getActualMs(t));
            let dnfs = vals.filter(v => v === Infinity).length;
            if (dnfs > 1) return Infinity; 
            
            vals.sort((a,b) => a - b);
            vals.shift(); vals.pop(); 
            return vals.reduce((a,b) => a+b, 0) / vals.length;
        }

        function calcStdDev(validMsArray) {
            if (validMsArray.length < 2) return null;
            const mean = validMsArray.reduce((a, b) => a + b) / validMsArray.length;
            const variance = validMsArray.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / validMsArray.length;
            return Math.sqrt(variance);
        }

        function updateChart() {
            if(times.length === 0) { if(chartInstance) chartInstance.destroy(); return; }
            let labels = [], dataT = [], dataAo5 = [];
            for(let i=0; i<times.length; i++) {
                labels.push(i+1);
                let ms = getActualMs(times[i]);
                dataT.push(ms === Infinity ? null : (ms / 1000).toFixed(2));
                
                let chunk = times.slice(Math.max(0, i-4), i+1);
                if (chunk.length === 5) {
                    let avg = calcWCA(chunk);
                    dataAo5.push((avg === null || avg === Infinity) ? null : (avg / 1000).toFixed(2));
                } else dataAo5.push(null);
            }
            drawChart(labels, dataT, dataAo5);
        }

        function drawChart(labels, dataT, dataAo5) {
            const ctx = document.getElementById('progressionChart').getContext('2d');
            if(chartInstance) chartInstance.destroy();
            const textColor = getComputedStyle(document.body).getPropertyValue('--text-muted').trim() || '#94a3b8';
            const accent = getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#3b82f6';

            chartInstance = new Chart(ctx, {
                type: 'line', data: { labels: labels, datasets: [
                    { label: 'Tiempo (s)', data: dataT, borderColor: textColor, borderWidth: 1, pointRadius: 2, tension: 0.2, spanGaps: true },
                    { label: 'Tendencia Ao5', data: dataAo5, borderColor: accent, borderWidth: 2, pointRadius: 0, tension: 0.3, spanGaps: true }
                ]},
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: textColor, font: {size: 10} } } }, scales: { x: { ticks: { color: textColor }, grid: { display: false } }, y: { ticks: { color: textColor }, grid: { color: 'rgba(128,128,128,0.1)' } } } }
            });
        }

        function updateStats() {
            if (times.length === 0) {
                document.querySelectorAll('.stat-value').forEach(el => el.innerText = '--');
                document.getElementById('times-list').innerHTML = '<li style="justify-content:center; color:var(--text-muted)">No hay tiempos en esta sesión</li>';
                updateChart(); return;
            }

            let validTimes = times.filter(t => t.penalty !== 'DNF').map(t => getActualMs(t));
            const best = validTimes.length > 0 ? Math.min(...validTimes) : Infinity;
            const worst = validTimes.length > 0 ? Math.max(...validTimes) : Infinity;
            
            let sum = 0, count = 0;
            times.forEach(t => { if(t.penalty !== 'DNF'){ sum += getActualMs(t); count++; } });
            const avgTotal = count > 0 ? sum / count : Infinity;
            const stdDev = validTimes.length > 1 ? calcStdDev(validTimes) : null;

            let allAo5s = [];
            for (let i = 4; i < times.length; i++) {
                let ao5 = calcWCA(times.slice(i-4, i+1));
                if (ao5 !== null && ao5 !== Infinity) allAo5s.push(ao5);
            }
            const bestAo5 = allAo5s.length > 0 ? Math.min(...allAo5s) : null;

            const currentAo5 = times.length >= 5 ? calcWCA(times.slice(-5)) : null;
            const currentAo12 = times.length >= 12 ? calcWCA(times.slice(-12)) : null;

            document.getElementById('stat-best').innerText = best === Infinity ? 'DNF' : formatTimeDisplay(best);
            document.getElementById('stat-worst').innerText = worst === Infinity ? 'DNF' : formatTimeDisplay(worst);
            document.getElementById('stat-total').innerText = avgTotal === Infinity ? 'DNF' : formatTimeDisplay(avgTotal);
            document.getElementById('stat-best-ao5').innerText = bestAo5 === null ? '--' : formatTimeDisplay(bestAo5);
            document.getElementById('stat-ao5').innerText = currentAo5 === null ? '--' : (currentAo5 === Infinity ? 'DNF' : formatTimeDisplay(currentAo5));
            document.getElementById('stat-ao12').innerText = currentAo12 === null ? '--' : (currentAo12 === Infinity ? 'DNF' : formatTimeDisplay(currentAo12));
            document.getElementById('stat-dev').innerText = stdDev === null ? '--' : (stdDev / 1000).toFixed(2) + 's';

            const list = document.getElementById('times-list');
            list.innerHTML = '';
            [...times].reverse().forEach((t, i) => {
                const oIdx = times.length - 1 - i;
                let li = document.createElement('li');
                let actMs = getActualMs(t);
                let displayStr = actMs === Infinity ? "DNF" : formatTimeDisplay(actMs);
                let penText = t.penalty === '+2' ? `<span class="time-penalty">(+2)</span>` : '';
                
                li.innerHTML = `
                    <div class="time-left">
                        <span class="time-index">#${oIdx + 1}</span>
                        <span class="time-value">${displayStr} ${penText}</span>
                    </div>
                    <div class="time-actions">
                        <button class="action-btn ${t.penalty === '+2' ? 'active-p2' : ''}" onclick="setPenalty(${oIdx}, '+2')">+2</button>
                        <button class="action-btn ${t.penalty === 'DNF' ? 'active-pen' : ''}" onclick="setPenalty(${oIdx}, 'DNF')">DNF</button>
                        <button class="action-btn" title="Ver Mezcla" onclick="showScrambleInfo(${oIdx})">📄</button>
                        <button class="delete-btn" title="Borrar" onclick="deleteTime(${oIdx})">✖</button>
                    </div>
                `;
                list.appendChild(li);
            });
            updateChart();
        }

        window.deleteTime = function(i) { if(confirm("¿Borrar este tiempo?")) { times.splice(i, 1); saveTimes(); updateStats(); } };
        window.clearSessionTimes = function() { if(times.length > 0 && confirm(`¿Borrar los tiempos de ${currentSession}?`)) { times = []; saveTimes(); updateStats(); } };

        function handlePress(e) {
            if (e.type === 'keydown' && e.code !== 'Space') return;
            if (e.type === 'keydown') e.preventDefault(); 
            if (e.repeat) return; 
            if (['BUTTON', 'SELECT', 'OPTION', 'INPUT'].includes(e.target.tagName)) return; 

            if (timerState === 'RUNNING') {
                clearInterval(timerInterval);
                times.push({ time: Date.now() - startTime, penalty: currentPenalty, scramble: currentScrambleStr });
                timerState = 'IDLE';
                timerDisplay.classList.remove('timer-ready');
                timerDisplay.style.color = '';
                saveTimes(); updateStats(); generateScramble();
                timerInstructions.innerText = wcaMode ? "Pulsa espacio para iniciar inspección de 15s" : "Mantén Espacio o Pantalla para preparar.";
            
            } else if (timerState === 'IDLE') {
                if (wcaMode) {
                    timerState = 'INSPECTION_PREP';
                    timerDisplay.classList.add('timer-inspecting');
                } else {
                    timerState = 'READY';
                    timerDisplay.classList.add('timer-ready');
                    timerDisplay.innerText = "00.00";
                }
            } else if (timerState === 'INSPECTING') {
                timerState = 'READY';
                timerDisplay.classList.remove('timer-inspecting', 'timer-penalty');
                timerDisplay.classList.add('timer-ready');
                clearInterval(inspectionInterval);
                if (inspectionTimeRemaining < 0 && inspectionTimeRemaining >= -2) currentPenalty = '+2';
                else if (inspectionTimeRemaining < -2) currentPenalty = 'DNF';
                else currentPenalty = null;
            }
        }

        function handleRelease(e) {
            if (e.type === 'keyup' && e.code !== 'Space') return;
            
            if (timerState === 'READY') {
                startTime = Date.now(); 
                timerState = 'RUNNING'; 
                timerDisplay.classList.remove('timer-ready');
                timerDisplay.style.color = '';
                timerInstructions.innerText = "Resolviendo...";
                timerInterval = setInterval(() => { 
                    let curMs = Date.now() - startTime;
                    if (currentPenalty === '+2') curMs += 2000;
                    timerDisplay.innerText = formatTimeDisplay(curMs); 
                }, 10);
            
            } else if (timerState === 'INSPECTION_PREP') {
                timerState = 'INSPECTING';
                timerDisplay.classList.remove('timer-inspecting');
                inspectionTimeRemaining = 15;
                timerDisplay.innerText = "15";
                timerInstructions.innerText = "Inspeccionando... Mantén espacio para prepararte.";
                
                inspectionInterval = setInterval(() => {
                    inspectionTimeRemaining--;
                    if (inspectionTimeRemaining === 7) playBeep(500, 200); 
                    if (inspectionTimeRemaining === 3) playBeep(500, 200); 
                    
                    if (inspectionTimeRemaining > 0) {
                        timerDisplay.innerText = inspectionTimeRemaining;
                    } else if (inspectionTimeRemaining === 0) {
                        timerDisplay.innerText = "+2";
                        timerDisplay.classList.add('timer-penalty');
                        playBeep(300, 500); 
                    } else if (inspectionTimeRemaining === -3) {
                        timerDisplay.innerText = "DNF";
                    }
                }, 1000);
            }
        }
        
        document.addEventListener('keydown', handlePress); document.addEventListener('keyup', handleRelease);
        timerArea.addEventListener('mousedown', handlePress); timerArea.addEventListener('mouseup', handleRelease);
        timerArea.addEventListener('touchstart', handlePress, {passive: false}); timerArea.addEventListener('touchend', handleRelease);

        const savedTheme = localStorage.getItem('rubik_timer_pro_theme');
        if(savedTheme) { document.getElementById('theme-selector').value = savedTheme; changeTheme(); }
        loadCustomPuzzles(); loadSessionsList(); handlePuzzleChange();
    </script>
</body>
